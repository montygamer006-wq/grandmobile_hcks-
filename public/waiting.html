<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Waiting for Approval</title>

  <link rel="stylesheet" href="style.css">

 <style>
  .waiting-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 18px;
  }

  .waiting-card {
    width: min(850px, 95%);
    text-align: center;
    background: #151c31;
    border: 1px solid #2c3858;
    border-radius: 20px;
    padding: 28px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
  }

  .waiting-card h1 {
    margin: 0 0 8px;
    font-size: 28px;
  }

  .waiting-card .muted {
    margin: 5px 0;
    line-height: 1.6;
  }

  .waiting-slideshow {
    width: 100%;
    height: 400px;
    margin: 22px auto;
    border-radius: 16px;
    overflow: hidden;
    background: #0d1426;
    box-shadow: 0 12px 35px rgba(0, 0, 0, .35);
  }

  .waiting-slideshow img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: opacity 1s ease-in-out;
  }

  .loading {
    display: inline-flex;
    gap: 8px;
    margin: 12px 0;
  }

  .dot {
    width: 9px;
    height: 9px;
    background: #6d7cff;
    border-radius: 50%;
    animation: pulse 1.2s infinite;
  }

  .dot:nth-child(2) {
    animation-delay: .2s;
  }

  .dot:nth-child(3) {
    animation-delay: .4s;
  }

  @keyframes pulse {
    0%, 100% {
      opacity: .3;
      transform: scale(.8);
    }

    50% {
      opacity: 1;
      transform: scale(1.2);
    }
  }

  @media (max-width: 700px) {
    .waiting-card {
      padding: 20px;
    }

    .waiting-slideshow {
      height: 260px;
    }

    .waiting-card h1 {
      font-size: 23px;
    }
  }
</style>
</head>

<body>

  <div class="waiting-page">

    <div class="waiting-card">

      <div class="slideshow">
  <img id="waitingImage" src="/waiting-images/image1.jpg" alt="Grand Mobile">
</div>

      <h1>Request Submitted</h1>

      <p class="muted">
        Your request has been received successfully.
      </p>

      <h2>Waiting for admin approval</h2>
<div class="waiting-slideshow">
  <img id="waitingImage" class="slide active" src="/waiting-images/image1.jpg" alt="Grand Mobile">
</div>
      <div class="loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <p id="status" class="muted">
        Please wait while your request is being reviewed.
      </p>

    </div>

  </div>

  <script>

    const slides = document.querySelectorAll(".slide");

    let currentSlide = 0;

    setInterval(() => {

      slides[currentSlide].classList.remove("active");

      currentSlide =
        (currentSlide + 1) % slides.length;

      slides[currentSlide].classList.add("active");

    }, 4000);


    const params =
      new URLSearchParams(window.location.search);

    const id = params.get("id");


    async function checkStatus() {

      if (!id) return;

      try {

        const response =
          await fetch("/api/status/" + id);

        const data =
          await response.json();


        if (data.status === "approved") {

          window.location.href = "/cars.html";

        }


        if (data.status === "declined") {

          document.getElementById("status").textContent =
            "Account was not found.";

        }

      } catch (error) {

        console.error(
          "Could not check status:",
          error
        );

      }

    }


    checkStatus();

    setInterval(checkStatus, 3000);

  </script>
<script>
  const waitingImages = [
    "/waiting-images/image1.jpg",
    "/waiting-images/image3.jpg",
    "/waiting-images/image4.jpg"
  ];

  let currentImage = 0;
  const waitingImage = document.getElementById("waitingImage");

  setInterval(() => {
    waitingImage.style.opacity = "0";

    setTimeout(() => {
      currentImage = (currentImage + 1) % waitingImages.length;
      waitingImage.src = waitingImages[currentImage];
      waitingImage.style.opacity = "1";
    }, 1000);

  }, 4000);
</script>
</body>
</html>
