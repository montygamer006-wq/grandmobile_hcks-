```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting for Approval</title>

 <style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
}

body {
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background: #151c31;
  color: #f5f7ff;
}

.waiting-card {
  width: 100%;
  min-height: 100vh;
  padding: 0;
  margin: 0;
  background: #151c31;
  border: none;
  border-radius: 0;
  box-shadow: none;
  text-align: center;
  display: flex;
  flex-direction: column;
  justify-content: center;
  overflow: hidden;
}

.slideshow {
  position: relative;
  width: 100%;
  height: 65vh;
  min-height: 300px;
  overflow: hidden;
  margin: 0;
  background: #0d1426;
}

.slideshow img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  opacity: 1;
  transition: opacity 1s ease;
}

h1 {
  margin: 18px 10px 5px;
  font-size: clamp(28px, 4vw, 46px);
}

h2 {
  margin: 8px 10px;
  font-size: clamp(20px, 3vw, 32px);
}

.muted {
  color: #aeb8d4;
  line-height: 1.6;
  margin: 8px 10px;
  font-size: clamp(15px, 2vw, 20px);
}

@media (max-width: 700px) {
  .slideshow {
    height: 55vh;
  }
}
</style>
</head>

<body>

  <div class="waiting-card">

    <div class="slideshow">
      <img
        id="waitingImage"
        src="/image1.jpg"
        alt="Grand Mobile"
      >
    </div>

    <h1>Request Submitted</h1>

    <p class="muted">
      Your request has been received successfully.
    </p>

    <h2>Waiting for admin approval</h2>

    <p id="status" class="muted">
      Please wait while your request is being reviewed.
    </p>

  </div>

  <script>
    const waitingImages = [
      "/image1.jpg",
      "/image3.jpg",
      "/image4.jpg"
    ];

    let currentImage = 0;

    const waitingImage =
      document.getElementById("waitingImage");

    setInterval(() => {
      waitingImage.style.opacity = "0";

      setTimeout(() => {
        currentImage =
          (currentImage + 1) % waitingImages.length;

        waitingImage.src =
          waitingImages[currentImage];

        waitingImage.style.opacity = "1";
      }, 1000);

    }, 4000);


    const params =
      new URLSearchParams(window.location.search);

    const id =
      params.get("id");


    async function checkStatus() {

      if (!id) return;

      try {

        const response =
          await fetch("/api/status/" + id);

        const data =
          await response.json();


        if (data.status === "approved") {

          window.location.href =
            "/cars.html";

        }


        if (data.status === "declined") {

          document.getElementById("status").textContent =
            "Account was not found.";

        }

      } catch (error) {

        console.error(
          "Could not check status:",
          error
        );

      }
    }


    checkStatus();

    setInterval(
      checkStatus,
      3000
    );
  </script>

</body>
</html>
