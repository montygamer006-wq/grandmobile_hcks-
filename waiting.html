<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting for Approval</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #172554, #080b14 55%, #030508);
      color: #f5f7ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .waiting-card {
      width: min(600px, 94%);
      padding: 28px;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .slideshow {
      width: 100%;
      height: 260px;
      overflow: hidden;
      border-radius: 14px;
      margin-bottom: 25px;
      background: #0d1426;
    }

    .slideshow img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 1;
      transition: opacity 1s ease;
    }

    h1 {
      margin: 10px 0;
    }

    h2 {
      margin-top: 24px;
    }

    .muted {
      color: #aeb8d4;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="waiting-card">

    <div class="slideshow">
      <img
        id="waitingImage"
        src="/image1.jpg"
        alt="Grand Mobile"
      >
    </div>

    <h1>Request Submitted</h1>

    <p class="muted">
      Your request has been received successfully.
    </p>

    <h2>Waiting for admin approval</h2>

    <p id="status" class="muted">
      Please wait while your request is being reviewed.
    </p>

  </div>

  <script>
    const waitingImages = [
      "/image1.jpg",
      "/image3.jpg",
      "/image4.jpg"
    ];

    let currentImage = 0;
    const waitingImage =
      document.getElementById("waitingImage");

    setInterval(() => {

      waitingImage.style.opacity = "0";

      setTimeout(() => {

        currentImage =
          (currentImage + 1) % waitingImages.length;

        waitingImage.src =
          waitingImages[currentImage];

        waitingImage.style.opacity = "1";

      }, 1000);

    }, 4000);


    const params =
      new URLSearchParams(window.location.search);

    const id =
      params.get("id");


    async function checkStatus() {

      if (!id) return;

      try {

        const response =
          await fetch("/api/status/" + id);

        const data =
          await response.json();


        if (data.status === "approved") {

          window.location.href =
            "/cars.html";

        }


        if (data.status === "declined") {

          document.getElementById("status").textContent =
            "Account was not found.";

        }

      } catch (error) {

        console.error(
          "Could not check status:",
          error
        );

      }
    }


    checkStatus();

    setInterval(checkStatus, 3000);
  </script>

</body>
</html>
