<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Waiting for Approval</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .waiting-page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
    }

    .waiting-card {
      width: min(1000%, 95%);
      min-height: 90px;
      display: flex;
      flex-direction: column;
      text-align: center;
      background: #151c31;
      border: 1px solid #2c3858;
      border-radius: 0px;
      padding: 0px;
      box-shadow: none;
    }

    .slideshow {
      position: relative;
      width: 100%;
      height: 68px;
      min-height: 300px;
      overflow: hidden;
      border-radius: 15px;
      background: #0d1426;
      margin-bottom: 0px;
    }

    .slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .slide.active {
      opacity: 1;
    }
.waiting-card h1 { margin: 18px 10px 5px; font-size: clamp(28px, 4vw, 46px); } .waiting-card h2 { margin: 8px 10px; font-size: clamp(20px, 3vw, 32px); } .waiting-card .muted { margin: 8px 10px; font-size: clamp(15px, 2vw, 20px); }
    .loading {
      display: inline-flex;
      gap: 7px;
      margin: 15px 0;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #6d7cff;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    .dot:nth-child(2) {
      animation-delay: .2s;
    }

    .dot:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: .3;
        transform: scale(.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    @media (max-width: 700px) {
      .slideshow {
        height: 68px;
      }
      .waiting-card h1 { margin-top: 12px; }
    }
  </style>
</head>

<body>

  <div class="waiting-page">

    <div class="waiting-card">

      <div class="slideshow">

        <img
          class="slide active"
          src="/waiting-images/image1.jpg"
          alt="Grand Mobile"
        >

        <img
          class="slide"
          src="/waiting-images/image2.jpg"
          alt="Grand Mobile"
        >

        <img
          class="slide"
          src="/waiting-images/image3.jpg"
          alt="Grand Mobile"
        >

        <img
          class="slide"
          src="/waiting-images/image4.jpg"
          alt="Grand Mobile"
        >

      </div>

      <h1>Request Submitted</h1>

      <p class="muted">
        Your request has been received successfully.
      </p>

      <h2>Waiting for admin approval</h2>

      <div class="loading">
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <p id="status" class="muted">
        Please wait while your request is being reviewed.
      </p>

    </div>

  </div>

  <script>

    const slides = document.querySelectorAll(".slide");

    let currentSlide = 0;

    setInterval(() => {

      slides[currentSlide].classList.remove("active");

      currentSlide =
        (currentSlide + 1) % slides.length;

      slides[currentSlide].classList.add("active");

    }, 4000);


    const params =
      new URLSearchParams(window.location.search);

    const id = params.get("id");


    async function checkStatus() {

      if (!id) return;

      try {

        const response =
          await fetch("/api/status/" + id);

        const data =
          await response.json();


        if (data.status === "approved") {

          window.location.href = "/cars.html";

        }


        if (data.status === "declined") {

          document.getElementById("status").textContent =
            "Account was not found.";

        }

      } catch (error) {

        console.error(
          "Could not check status:",
          error
        );

      }

    }


    checkStatus();

    setInterval(checkStatus, 3000);

  </script>

</body>
</html>
